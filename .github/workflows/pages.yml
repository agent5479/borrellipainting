name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set quotes password hashes
        env:
          QUOTES_ADMIN_PASSWORD: ${{ secrets.QUOTES_ADMIN_PASSWORD }}
          GBTECH_ADMIN: ${{ secrets.gbtech_admin }}
        run: |
          hashes=""
          hash_one() {
            printf '%s' "$1" | sha256sum | cut -d' ' -f1
          }
          if [ -n "$QUOTES_ADMIN_PASSWORD" ]; then
            hashes="$(hash_one "$QUOTES_ADMIN_PASSWORD")"
          fi
          if [ -n "$GBTECH_ADMIN" ]; then
            next="$(hash_one "$GBTECH_ADMIN")"
            if [ -n "$hashes" ]; then
              hashes="$hashes,$next"
            else
              hashes="$next"
            fi
          fi
          if [ -z "$hashes" ]; then
            echo "Set QUOTES_ADMIN_PASSWORD and/or gbtech_admin as Actions secrets" >&2
            exit 1
          fi
          echo "VITE_QUOTES_PASSWORD_HASH=$hashes" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
