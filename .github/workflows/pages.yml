name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set quotes password hash
        env:
          QUOTES_ADMIN_PASSWORD: ${{ secrets.QUOTES_ADMIN_PASSWORD }}
        run: |
          if [ -z "$QUOTES_ADMIN_PASSWORD" ]; then
            echo "QUOTES_ADMIN_PASSWORD secret is required" >&2
            exit 1
          fi
          echo "VITE_QUOTES_PASSWORD_HASH=$(printf '%s' "$QUOTES_ADMIN_PASSWORD" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
