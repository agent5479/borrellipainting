<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Borrelli Painting">
  <defs>
    <linearGradient id="paint" x1="10" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b8d94a"/>
      <stop offset="45%" stop-color="#3ec8c8"/>
      <stop offset="100%" stop-color="#2c7bb8"/>
    </linearGradient>
  </defs>
  <!-- circular paint stroke -->
  <path
    fill="none"
    stroke="url(#paint)"
    stroke-width="12"
    stroke-linecap="round"
    d="M20 18c-6 10-2 28 16 34 10 3.5 20-1 24-10"
  />
  <!-- bristly start -->
  <path
    fill="none"
    stroke="#b8d94a"
    stroke-width="2.6"
    stroke-linecap="round"
    d="M16 14.5l2.4 3.8M13.8 18.2l4 1.5M17.2 12.2l1.4 3.8"
  />
  <!-- roller frame + handle -->
  <g fill="none" stroke="#5c5c5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 44.5h11"/>
    <path d="M37 44.5v6.5"/>
    <path d="M37 51l8.5 8.5"/>
  </g>
  <!-- roller sleeve -->
  <g transform="rotate(-38 31.5 41)">
    <rect x="20.5" y="35.2" width="22" height="11.6" rx="5.8" fill="#2c7bb8"/>
    <rect x="22.2" y="37" width="18.6" height="3.4" rx="1.5" fill="#3ec8c8" opacity="0.5"/>
  </g>
</svg>
